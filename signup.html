<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up</title></head>
<body>
<center>
<h1>Sign Up</h1>

<form action="">
<fieldset>
<legend>Enter Required Data</legend>
<label for="full_name">Full Name:</label><br>
<input type="text" id="" name="full_name" required="required" placeholder="Enter your full name"><br><br>
<label for="email">Email:</label><br>
<input type="email" id="" name="email" required="required" placeholder="Enter your Email"><br><br>
<label for="phone">Phone:</label><br>
<input type="tel" id="" name="phone" required="required" placeholder="Enter your phone number"><br><br>
<label for="gender">Select Gender</label><br>
<select id="" name="gender" required="required">
<option value="male">Male</option>
<option value="female">Female</option>
<option value="other">Other</option>
</select><br><br>
<label for="password">Password:</label><br>
<input type="password" id="" name="password" required="required" placeholder="Enter your password"><br><br>
<label for="confirm_password">Confirm Password:</label><br>
<input type="password" id="" name="confirm_password" required="required" placeholder="Confirm your password"><br><br>
<input type="checkbox" id="" name="terms" required>
<label for="terms">I agree to the Terms and Conditions.</label><br><br>
<button type="submit">Create Account</button>
</fieldset>
</form>
<p>Already have an account? <a href="login.html">Login</a></p>
<p><a href="index.html">Back to Home</a></p>
</center>
</body>
</html>
